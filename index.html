  <script>
    (function () {
      fetch('https://sammylwolfson.substack.com/feed')
        .then(function (res) { return res.text(); })
        .then(function (xml) {
          var doc = new DOMParser().parseFromString(xml, 'text/xml');
          var item = doc.querySelector('item');
          if (!item) return;
          var title = (item.querySelector('title') || {}).textContent || '';
          var link = (item.querySelector('link') || {}).textContent || '';
          var date = (item.querySelector('pubDate') || {}).textContent || '';
          var desc = (item.querySelector('description') || {}).textContent || '';
          if (!title || !link) return;
          var titleEl = document.getElementById('latest-title');
          var moreEl = document.getElementById('latest-more');
          var dateEl = document.getElementById('latest-date');
          var excerptEl = document.getElementById('latest-excerpt');
          titleEl.textContent = title;
          titleEl.href = link;
          moreEl.href = link;
          if (date) {
            var d = new Date(date);
            if (!isNaN(d)) {
              dateEl.dateTime = d.toISOString().slice(0, 10);
              dateEl.textContent = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            }
          }
          if (desc) excerptEl.textContent = desc.replace(/<[^>]+>/g, '').trim();
        })
        .catch(function () {});
    })();
  </script>
